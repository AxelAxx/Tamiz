function button({ label = '', variant = 'default', size = 'default', action, arg, ic, cls = '', attrs = '', type = 'button', disabled = false, ariaLabel }) {
  return `<button type="${type}" data-slot="button" data-variant="${variant}" class="${btnCls(variant, size, cls)}"${attr('data-action', action)}${attr('data-arg', arg)}${attr('aria-label', ariaLabel)}${disabled ? ' disabled' : ''} ${attrs}>${ic ? icon(ic) : ''}${esc(label)}</button>`;
}
const CARD = 'rounded-xl border bg-card text-card-foreground shadow-xs';
const INPUT = 'h-9 w-full min-w-0 rounded-md border bg-surface px-3 py-1 text-base shadow-xs transition-[color,box-shadow] placeholder:text-muted-foreground md:text-sm';

const SELECT = 'h-9 w-full rounded-md border border-input bg-surface px-2.5 text-sm shadow-xs';
const LABEL = 'flex items-center gap-2 text-sm font-medium leading-none';
const SKEL = 'animate-pulse rounded-md bg-muted motion-reduce:animate-none';
const TOOLTIP = 'invisible absolute z-40 w-max max-w-72 rounded-md border bg-popover px-2.5 py-1.5 text-xs text-popover-foreground opacity-0 shadow-md transition-opacity';

// ---------- custom Tamiz components ----------
const BADGE = 'inline-flex w-fit shrink-0 items-center gap-1 whitespace-nowrap rounded-md border px-1.5 py-0.5 text-xs font-medium';
const TONE = {
  local: 'border-local/25 bg-local-soft text-local',
  eu: 'border-eu/25 bg-eu-soft text-eu',
  external: 'border-external/25 bg-external-soft text-external',
  success: 'border-success/25 bg-success-soft text-success',
  warning: 'border-warning/30 bg-warning-soft text-warning',
  danger: 'border-danger/25 bg-danger-soft text-danger',
  info: 'border-info/30 bg-info-soft text-info',

const badge = (tone, ic, label, extra = '') => `<span data-slot="badge" class="${cx(BADGE, TONE[tone])}"${extra}>${ic ? icon(ic, 'size-3.5') : ''}${esc(label)}</span>`;

const RES = {

  eu: { label: 'EU', icon: 'shield-check', tone: 'eu' },
  us: { label: 'US', icon: 'globe', tone: 'external' },
  global: { label: 'Global', icon: 'globe', tone: 'external' }
};
const residencyBadge = (r, size = 'default') => `<span data-slot="badge" data-component="residency-badge" data-residency="${r}" class="${cx(BADGE, TONE[RES[r].tone], size === 'sm' ? 'px-1 py-0' : '')}">${icon(RES[r].icon, size === 'sm' ? 'size-3' : 'size-3.5')}${RES[r].label}</span>`;

const OUTCOME = {
  answered: { label: 'Answered', icon: 'circle-check', tone: 'success' },
  failed: { label: 'Failed', icon: 'circle-x', tone: 'danger' },
  blocked: { label: 'Blocked', icon: 'ban', tone: 'danger' },
  cancelled: { label: 'Cancelled', icon: 'circle-minus', tone: 'neutral' }
};
const outcomeBadge = (o) => `<span data-slot="badge" data-component="outcome-badge" data-outcome="${o}" class="${cx(BADGE, TONE[OUTCOME[o].tone])}">${icon(OUTCOME[o].icon, 'size-3.5')}${OUTCOME[o].label}</span>`;

const ACTION = {
  allow: { label: 'allow', icon: 'arrow-up-right', tone: 'neutral' },
  anonymize: { label: 'anonymize', icon: 'venetian-mask', tone: 'info' },
  restrict_to_local: { label: 'local only', icon: 'lock-keyhole', tone: 'local' },
  block: { label: 'block', icon: 'ban', tone: 'danger' }
};
const actionBadge = (a) => `<span data-slot="badge" data-component="privacy-action-badge" data-action-value="${a}" class="${cx(BADGE, OUTLINE[ACTION[a].tone])}">${icon(ACTION[a].icon, 'size-3.5')}${ACTION[a].label}</span>`;

const SENS = { none: [0, ''], low: [1, 'bg-muted-foreground'], high: [3, 'bg-warning'], critical: [4, 'bg-danger'], unknown: [-1, ''] };
const BAR_H = ['h-1.5', 'h-2', 'h-2.5', 'h-3'];
function sensitivity(level, { suffix = '' } = {}) {
  const [fill, color] = SENS[level];
  const bars = BAR_H.map((h, i) => `<span class="${cx(h, 'w-1 rounded-xs', fill < 0 ? 'border border-dashed border-muted-foreground' : i < fill ? color : 'bg-border')}"></span>`).join('');
  const word = level === 'critical' ? 'font-semibold' : level === 'none' || level === 'unknown' ? 'text-muted-foreground' : '';
  return `<span data-component="sensitivity-indicator" data-level="${level}" class="inline-flex items-center gap-1.5"><span class="flex items-end gap-0.5" aria-hidden="true">${bars}</span>${fill < 0 ? icon('circle-help', 'size-3.5 text-muted-foreground') : ''}<span class="${word}">${level}</span>${suffix}</span>`;
}

function entityChip(kind, count) {
  const crit = CRITICAL.includes(kind);
  const cls = crit
    ? 'inline-flex items-center gap-1 whitespace-nowrap rounded-sm border border-foreground/25 bg-surface px-1.5 py-0.5 font-mono text-xs font-semibold'
    : 'inline-flex items-center gap-1 whitespace-nowrap rounded-sm border border-transparent bg-muted px-1.5 py-0.5 font-mono text-xs';
  return `<span data-component="entity-chip" data-critical="${crit}" class="${cls}" title="${esc(ENT[kind] + (crit ? ' · critical' : ''))}">${crit ? '<span class="size-1.5 rounded-xs bg-danger" aria-hidden="true"></span><span class="sr-only">critical</span>' : ''}${kind}<span class="font-normal text-muted-foreground">×${count}</span></span>`;
}
function entityChips(entities, max = 3, emptyLabel = 'none') {
  const kinds = Object.keys(entities).sort((a, b) => CRITICAL.includes(b) - CRITICAL.includes(a));
  if (!kinds.length) return `<span class="text-xs leading-5 text-muted-foreground">${emptyLabel}</span>`;
  const shown = kinds.slice(0, max).map((k) => entityChip(k, entities[k])).join('');
  const rest = kinds.slice(max);
  const more = rest.length ? `<span class="inline-flex items-center rounded-sm border border-dashed px-1.5 py-0.5 font-mono text-xs text-muted-foreground" title="${esc(rest.map((k) => k + ' ×' + entities[k]).join(', '))}">+${rest.length}</span>` : '';
  return `<span class="flex flex-wrap gap-1">${shown}${more}</span>`;
}

function fallbackMarker(abandoned, interactive = true) {
  if (!abandoned.length) return '';
  const label = 'Fell back ' + abandoned.length + (abandoned.length === 1 ? ' time: ' : ' times: ') + abandoned.map((a) => a.id + ' ' + a.reason).join(', ');
  if (!interactive) return `<span data-component="fallback-marker" class="inline-flex items-center gap-0.5 text-xs font-medium text-warning">${icon('corner-down-right', 'size-3.5')}${abandoned.length}<span class="sr-only">${esc(label)}</span></span>`;
  const list = abandoned.map((a) => `<span class="block"><span class="font-mono">${a.id}</span> · ${a.reason}</span>`).join('');
  return `<span data-component="fallback-marker" class="group/fb relative inline-flex shrink-0"><button type="button" data-slot="tooltip-trigger" class="inline-flex h-5 items-center gap-0.5 rounded-sm px-1 text-xs font-medium text-warning hover:bg-warning-soft" aria-label="${esc(label)}">${icon('corner-down-right', 'size-3.5')}<span class="tabular">${abandoned.length}</span></button><span role="tooltip" data-slot="tooltip-content" class="${TOOLTIP} left-0 top-full mt-1 group-hover/fb:visible group-hover/fb:opacity-100 group-focus-within/fb:visible group-focus-within/fb:opacity-100"><span class="mb-1 block font-medium">Fell back from</span>${list}</span></span>`;
}

const CIRCUIT = {
  closed: { label: 'closed', icon: 'circle-check', tone: 'success' },
  open: { label: 'open', icon: 'circle-off', tone: 'danger' },
  half_open: { label: 'half open', icon: 'circle-dashed', tone: 'warning' }
};
const circuitBadge = (state, cooldown) => `<span data-slot="badge" data-component="circuit-badge" data-state="${state}" class="${cx(BADGE, TONE[CIRCUIT[state].tone])}">${icon(CIRCUIT[state].icon, 'size-3.5')}${CIRCUIT[state].label}${state === 'open' && cooldown != null ? `<span class="tabular font-normal">· retry in ${cooldown} s</span>` : ''}</span>`;

const PASSFAIL = {
  pass: { label: 'pass', icon: 'circle-check', cls: 'text-success' },
  fail: { label: 'fail', icon: 'circle-x', cls: 'text-danger' },
  error: { label: 'error', icon: 'triangle-alert', cls: 'text-warning' },
  skipped: { label: 'skipped', icon: 'skip-forward', cls: 'text-muted-foreground' }
};
function passFail(status, size = 'sm') {
  const p = PASSFAIL[status];
  if (size === 'lg') return `<span data-component="pass-fail-mark" data-status="${status}" class="${cx('inline-flex items-center gap-2 text-2xl font-semibold tracking-tight', p.cls)}">${icon(p.icon, 'size-7')}${cap(p.label)}</span>`;
  return `<span data-component="pass-fail-mark" data-status="${status}" class="${cx('inline-flex items-center gap-1 text-sm font-medium', p.cls)}">${icon(p.icon, 'size-4')}${p.label}</span>`;
}
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const targetLabel = (id) => `<span data-component="target-label" class="min-w-0 truncate font-mono text-xs" title="${esc(TARGETS[id].provider + ' · ' + TARGETS[id].model)}">${id}</span>`;

// ---------- region states ----------
const regionLoading = (rows = 6) => `<div data-component="region-loading" aria-busy="true" aria-label="Loading" class="flex flex-col divide-y">${Array.from({ length: rows }, () => `<div class="flex items-center gap-4 px-4 py-3.5"><span class="${SKEL} h-5 w-28"></span><span class="${SKEL} hidden h-3 w-24 md:block"></span><span class="${SKEL} h-3 w-16"></span><span class="${SKEL} hidden h-5 w-24 md:block"></span><span class="${SKEL} ml-auto h-3 w-12"></span></div>`).join('')}</div>`;
const regionEmpty = ({ ic = 'inbox', text, actionHtml = '' }) => `<div data-component="region-empty" class="flex flex-col items-center gap-3 px-6 py-16 text-center"><span class="grid size-10 place-items-center rounded-full bg-muted text-muted-foreground">${icon(ic, 'size-5')}</span><p class="max-w-md text-sm text-muted-foreground">${text}</p>${actionHtml}</div>`;
const regionError = ({ title, text, reqId, retry = 'retry' }) => `<div data-component="region-error" role="alert" class="flex flex-col items-center gap-3 px-6 py-16 text-center"><span class="grid size-10 place-items-center rounded-full bg-danger-soft text-danger">${icon('triangle-alert', 'size-5')}</span><h3 class="text-base font-semibold">${esc(title)}</h3><p class="max-w-md text-sm text-muted-foreground">${text}</p>${reqId ? `<p class="text-xs text-muted-foreground">Gateway request id <span class="font-mono text-foreground">${reqId}</span></p>` : ''}${button({ label: 'Retry', ic: 'refresh-cw', size: 'sm', action: retry })}</div>`;
const staleNote = (text) => `<p data-component="region-stale" class="inline-flex items-center gap-1.5 text-xs text-muted-foreground">${icon('clock', 'size-3.5')}${esc(text)}</p>`;

// ---------- traffic rows (live + audit) ----------
function rowView(r) {
  const t = r.target ? TARGETS[r.target] : null;
  const routed = !!t && (r.outcome === 'answered' || r.outcome === 'cancelled');
  const started = NOW - r.age * 1000;
  return { ...r, t, routed, started, reasonShort: r.blockReason ? REASON[r.blockReason] : r.outcome === 'failed' ? 'all targets failed' : '' };
}
function routeLine(v, interactiveFallback = true) {
  const head = v.routed ? residencyBadge(v.t.residency) + targetLabel(v.target) : outcomeBadge(v.outcome);
  return `<div class="flex min-w-0 items-center gap-1.5">${head}${fallbackMarker(v.abandoned, interactiveFallback)}</div>`;
}
function trafficTable(rows, { audit = false, selected } = {}) {
  const head = audit
    ? `<th scope="col" class="h-9 w-[15%] pr-3 pl-4 font-medium">Started (UTC)</th><th scope="col" class="h-9 w-[30%] px-3 font-medium xl:w-[25%]">Request</th><th scope="col" class="hidden h-9 w-[14%] px-3 font-medium xl:table-cell">Rule</th><th scope="col" class="h-9 w-[17%] px-3 font-medium xl:w-[14%]">Privacy</th><th scope="col" class="h-9 px-3 font-medium">Entities</th><th scope="col" class="h-9 w-[13%] pr-4 pl-2 text-right font-medium xl:w-[10%]">Cost</th>`
    : `<th scope="col" class="h-9 w-[29%] pr-3 pl-4 font-medium">Request</th><th scope="col" class="h-9 w-[18%] px-3 font-medium">Rule</th><th scope="col" class="h-9 w-[17%] px-3 font-medium">Privacy</th><th scope="col" class="h-9 px-3 font-medium">Entities</th><th scope="col" class="h-9 w-[13%] pr-4 pl-2 text-right font-medium xl:w-[11%]">Cost</th>`;
  const body = rows.map((r) => {
    const v = rowView(r);
    const rowCls = cx('cursor-pointer border-b transition-colors last:border-b-0 hover:bg-accent/60', r.isNew && 'animate-row-in', selected === r.reqId && 'bg-accent');
    const meta = audit
      ? `<span class="shrink-0 font-mono">${v.reqId}</span><span class="truncate font-mono xl:hidden">· ${v.rule}</span>${v.routed ? '' : `<span class="hidden truncate xl:inline">· ${v.reasonShort}</span>`}`
      : `<button type="button" class="tabular shrink-0 rounded-sm hover:text-foreground" title="${absTime(v.started)}" data-action="openRow" data-arg="${v.reqId}" aria-label="Open details for request ${v.reqId}">${ago(v.age)}</button>${v.routed ? '<span class="hidden truncate xl:inline">· client <span class="font-mono">demo</span></span>' : `<span class="truncate">· ${v.reasonShort}</span>`}`;
    const started = audit ? `<td class="py-2.5 pr-3 pl-4 align-top"><button type="button" class="tabular rounded-sm text-left leading-5" data-action="openRow" data-arg="${v.reqId}" aria-label="Open details for request ${v.reqId}">${absShort(v.started)}</button><div class="tabular mt-1 text-xs text-muted-foreground">${absDate(v.started)}</div></td>` : '';
    return `<tr data-slot="table-row" class="${rowCls}" data-action="openRow" data-arg="${v.reqId}">
${started}<td class="${audit ? 'px-3' : 'pr-3 pl-4'} py-2.5 align-top">${routeLine(v)}<div class="mt-1 flex min-w-0 items-center gap-1 text-xs text-muted-foreground">${meta}</div></td>
<td class="${cx('px-3 py-2.5 align-top', audit && 'hidden xl:table-cell')}"><div class="truncate font-mono text-xs leading-5" title="${v.rule}">${v.rule}</div><div class="mt-1 hidden truncate text-xs text-muted-foreground xl:block">${v.task} · ${v.size}</div></td>
<td class="px-3 py-2.5 align-top"><div class="flex h-5 items-center">${sensitivity(v.sens)}</div><div class="mt-1">${actionBadge(v.action)}</div></td>
<td class="px-3 py-2.5 align-top">${entityChips(v.entities)}</td>
<td class="py-2.5 pr-4 pl-2 text-right align-top"><div class="tabular leading-5">${money(v.cost)}</div><div class="tabular mt-1 hidden text-xs text-muted-foreground xl:block">${ms(v.latency)}</div></td>
</tr>`;
  }).join('');
  return `<div class="hidden md:block"><table data-slot="table" class="w-full table-fixed border-collapse text-sm"><caption class="sr-only">Requests, newest first. Activate a row to see its details.</caption><thead data-slot="table-header"><tr class="border-b text-left text-xs text-muted-foreground">${head}</tr></thead><tbody data-slot="table-body">${body}</tbody></table></div>`;
}
function trafficCards(rows, { audit = false, selected } = {}) {
  const items = rows.map((r) => {
    const v = rowView(r);
    const head = v.routed ? residencyBadge(v.t.residency) + `<span class="truncate font-mono text-xs">${v.target}</span>` : outcomeBadge(v.outcome) + `<span class="truncate text-xs text-muted-foreground">${v.reasonShort}</span>`;
    return `<li class="${cx('hover:bg-accent/60', r.isNew && 'animate-row-in', selected === r.reqId && 'bg-accent')}"><button type="button" class="flex w-full flex-col gap-2 px-4 py-3 text-left" data-action="openRow" data-arg="${v.reqId}" aria-label="Open details for request ${v.reqId}">
<span class="flex w-full items-center gap-1.5">${head}${fallbackMarker(v.abandoned, false)}<span class="tabular ml-auto shrink-0 text-xs text-muted-foreground">${audit ? absShort(v.started) : ago(v.age)}</span></span>
<span class="flex flex-wrap gap-1">${entityChips(v.entities, 3, 'No personal data')}</span>
<span class="flex w-full items-center gap-2">${actionBadge(v.action)}<span class="text-xs text-muted-foreground">${v.sens}</span><span class="tabular ml-auto text-sm">${money(v.cost)}</span></span>
</button></li>`;
  }).join('');
  return `<ul class="divide-y md:hidden" aria-label="Requests, newest first">${items}</ul>`;
}

// ---------- entry detail drawer ----------
function detailDrawer(row) {
  if (!row) return '';
  if (row === 'loading' || row === 'missing') {
    const body = row === 'loading'
      ? `<div class="flex flex-col gap-3 p-5" aria-busy="true"><span class="${SKEL} h-5 w-40"></span><span class="${SKEL} h-4 w-64"></span><span class="${SKEL} h-24 w-full"></span><span class="${SKEL} h-24 w-full"></span></div>`
      : regionEmpty({ ic: 'search-x', text: 'No audit entry with id <span class="font-mono text-foreground">req-0000</span>. It may be older than the retention window.' });
    return sheetFrame('Request', body);
  }
  const v = rowView(row);
  const dl = (pairs) => `<dl class="mt-2 grid grid-cols-[8.5rem_minmax(0,1fr)] gap-x-3 gap-y-2 text-sm">${pairs.map(([k, val]) => `<dt class="text-muted-foreground">${k}</dt><dd class="min-w-0">${val}</dd>`).join('')}</dl>`;
  const h3 = (t) => `<h3 class="mt-6 text-xs font-semibold tracking-wide text-muted-foreground uppercase">${t}</h3>`;
  const mono = (s) => `<span class="font-mono text-xs leading-5">${esc(s)}</span>`;
  const abandoned = v.abandoned.length ? `<ul class="flex flex-col gap-1">${v.abandoned.map((a) => `<li class="flex items-center gap-1.5">${icon('corner-down-right', 'size-3.5 text-warning')}${mono(a.id)}<span class="text-muted-foreground">· ${a.reason}</span></li>`).join('')}</ul>` : '<span class="text-muted-foreground">None</span>';
  const body = `<div class="flex-1 overflow-y-auto px-4 pt-4 pb-6 md:px-5">
<p class="flex items-start gap-2 rounded-md border bg-muted px-3 py-2 text-xs text-muted-foreground">${icon('eye-off', 'mt-px size-3.5')}<span><span class="font-medium text-foreground">Tamiz never stores what was said.</span> This entry holds kinds, counts, routes and costs only.</span></p>
${h3('Route')}${dl([
    ['Target', v.target ? mono(v.target) : '<span class="text-muted-foreground">No target answered</span>'],
    ['Provider · model', v.t ? `${v.t.provider} · ${mono(v.t.model)}` : '—'],
    ['Residency', v.t ? residencyBadge(v.t.residency) : '—'],
    ['Abandoned', abandoned]
  ])}
${h3('Privacy')}${dl([
    ['Sensitivity', sensitivity(v.sens)],
    ['Entities', entityChips(v.entities, 99, 'None found')],
    ['Action', actionBadge(v.action)],
    ['Notice version', mono(v.notice || '—')],
    ['Block reason', v.blockReason ? `${REASON[v.blockReason]} ${mono('(' + v.blockReason + ')')}` : '—']
  ])}
${h3('Request')}${dl([
    ['Request id', mono(v.reqId)],
    ['Request hash', `<span class="flex items-center gap-1">${mono(v.hash + '…')}${button({ variant: 'ghost', size: 'icon-sm', ic: 'copy', ariaLabel: 'Copy request hash', action: 'copyHash' })}</span>`],
    ['Client', mono('demo')],
    ['Started', `<span class="tabular">${absTime(v.started)}</span>`],
    ['Ended', `<span class="tabular">${absTime(v.started + v.latency)}</span>`],
    ['Latency', `<span class="tabular">${ms(v.latency)}</span>`],
    ['Streamed', v.streamed ? 'Yes' : 'No'],
    ['Policy', `${mono(POLICY.id)} · version ${POLICY.version}`],
    ['Rule', mono(v.rule)],
    ['Task · size', `${v.task} · ${v.size}`],
    ['Outcome', outcomeBadge(v.outcome)],
    ['Error type', mono(v.errorType || '—')]
  ])}
${h3('Usage and cost')}${dl([
    ['Tokens in · out', `<span class="tabular">${num(v.tin)} · ${num(v.tout)}</span>${v.est ? ' ' + badge('neutral', null, 'estimated') : ''}`],
    ['Cost', `<span class="tabular font-medium">${money(v.cost)}</span>`],
    ['Baseline cost', `<span class="tabular">${money(v.baseline)}</span> <span class="text-muted-foreground">on</span> ${mono('anthropic-sonnet')}`]
  ])}
</div>
<div class="flex items-center justify-between gap-2 border-t px-4 py-3 md:px-5"><a href="audit.html?rule=${v.rule}" class="${cx(BTN_BASE, BTN_VARIANT.link, 'h-9 px-0')}">See requests with this rule${icon('arrow-right', 'size-3.5')}</a><span class="text-xs text-muted-foreground">Times in UTC</span></div>`;
  const sub = `<div class="mt-1.5 flex flex-wrap items-center gap-1.5">${v.routed ? residencyBadge(v.t.residency) + `<span class="font-mono text-xs">${v.target}</span>` : ''}${outcomeBadge(v.outcome)}</div>`;
  return sheetFrame(`Request <span class="font-mono">${v.reqId}</span>`, body, sub);
}
function sheetFrame(title, body, sub = '') {
  return `<div data-slot="sheet-overlay" class="fixed inset-0 z-40 bg-black/50 animate-fade-in" data-action="closeDetail" aria-hidden="true"></div>
<div data-slot="sheet-content" data-side="right" role="dialog" aria-modal="true" aria-labelledby="detail-title" class="fixed inset-y-0 right-0 z-50 flex w-full flex-col border-l bg-surface shadow-lg animate-sheet-in md:w-110">
<div data-slot="sheet-header" class="flex items-start gap-3 border-b px-4 py-3 md:px-5"><div class="min-w-0 flex-1"><h2 id="detail-title" data-slot="sheet-title" class="text-base font-semibold">${title}</h2>${sub}</div>${button({ variant: 'ghost', size: 'icon', ic: 'x', ariaLabel: 'Close details', action: 'closeDetail', cls: 'max-md:size-11' })}</div>
${body}</div>`;
}

const SCREENS = [
  { id: 'live', label: 'Live traffic', icon: 'activity' },
  { id: 'simulator', label: 'Simulator', icon: 'flask-conical' },
  { id: 'audit', label: 'Audit log', icon: 'scroll-text' },

// ---------- runtime ----------
let S = {};
let SCREEN = null;
const KIT_ACTIONS = {
  toggleTheme: () => set({ theme: S.theme === 'dark' ? 'light' : 'dark', opMenu: false }),
  setTheme: (v) => set({ theme: v }),
  setMotion: (v) => set({ reduced: v === 'reduced' }),
  toggleProto: () => set({ protoOpen: !S.protoOpen }),
  toggleSidebar: () => set({ sidebarExpanded: !S.sidebarExpanded }),
  openNav: () => set({ navOpen: true }),
  closeNav: () => set({ navOpen: false }),
  toggleGwPop: () => set({ gwPop: !S.gwPop, opMenu: false }),
  toggleOpMenu: () => set({ opMenu: !S.opMenu, gwPop: false }),
  toggleReveal: () => set({ reveal: !S.reveal }),
  openRow: (id) => set({ detail: id, opMenu: false }),
  closeDetail: () => set({ detail: null }),
  copyHash: () => toast('Request hash copied'),
  sessionSubmit: () => { set({ sessionDialog: false }); toast('Signed in again. Your work is kept.'); }
};
let toastTimer;
function toast(text, tone) {
  clearTimeout(toastTimer);
  set({ toast: { text, tone } });
  toastTimer = setTimeout(() => set({ toast: null }), 2600);
}
function set(patch) {
  Object.assign(S, patch);
  render();
}
function syncUrl() {
  const p = new URLSearchParams(location.search);
  p.set('state', S.state);
  p.set('theme', S.theme);
  history.replaceState(null, '', '?' + p.toString());
}
function render() {
  const root = document.documentElement;
  root.classList.toggle('dark', S.theme === 'dark');
  root.classList.toggle('reduce-motion', !!S.reduced);
  const app = document.getElementById('app');
  const inner = SCREEN.render(S);
  const content = SCREEN.shell === false ? inner : shell(S, SCREEN.title, inner);
  app.innerHTML = content + (SCREEN.overlay ? SCREEN.overlay(S) : '') + toastHtml(S.toast) + protoPanel(S, SCREEN);
  if (S.chrome !== false) syncUrl();
  if (SCREEN.afterRender) SCREEN.afterRender(S);
}
function applyState(v) {
  S.state = v;
  S.detail = null;
  S.sessionDialog = false;
  if (SCREEN.applyState) SCREEN.applyState(S, v);
}
function boot(screen) {
  SCREEN = screen;
  const p = new URLSearchParams(location.search);
  S = {
    screen: screen.id,
    theme: p.get('theme') || 'dark',
    gw: p.get('gw') || 'ok',
    chrome: p.get('chrome') !== '0',
    static: p.get('static') === '1',
    reduced: false,
    protoOpen: false
  };
  if (screen.init) screen.init(S, p);
  applyState(p.get('state') || screen.states[0][0]);
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) {
      if (S.opMenu || S.gwPop) set({ opMenu: false, gwPop: false });
      return;
    }
    const name = el.dataset.action;
    const fn = (screen.actions && screen.actions[name]) || KIT_ACTIONS[name];
    if (fn) { e.preventDefault(); fn(el.dataset.arg, el); }
  });
  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-change]');
    if (!el) return;
    if (el.dataset.change === 'setState') { applyState(el.value); render(); return; }
    if (el.dataset.change === 'setGw') { set({ gw: el.value }); return; }
    const fn = screen.actions && screen.actions[el.dataset.change];
    if (fn) fn(el.value, el);
  });
  document.addEventListener('input', (e) => {
    const el = e.target.closest('[data-input]');
    if (!el) return;
    const fn = screen.actions && screen.actions['input:' + el.dataset.input];
    if (fn) fn(el.value, el); else S[el.dataset.input] = el.value;
  });
  document.addEventListener('submit', (e) => {
    const el = e.target.closest('[data-submit]');
    if (!el) return;
    e.preventDefault();
    const name = el.dataset.submit;
    const fn = (screen.actions && screen.actions[name]) || KIT_ACTIONS[name];
    if (fn) fn();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (S.detail) set({ detail: null });
      else if (S.navOpen || S.opMenu || S.gwPop) set({ navOpen: false, opMenu: false, gwPop: false });
    }
    const el = e.target.closest && e.target.closest('[data-keydown]');
    if (el && screen.actions) { const fn = screen.actions['key:' + el.dataset.keydown]; if (fn) fn(e); }
  });
  render();
  if (screen.mount) screen.mount(S);
}

    const loadingCards = Array.from({ length: 4 }, () => `<div data-slot="card" class="${CARD} flex flex-col gap-4 p-4"><div class="flex justify-between"><div class="flex flex-col gap-2"><span class="${SKEL} h-4 w-32"></span><span class="${SKEL} h-3 w-40"></span></div><span class="${SKEL} h-5 w-14"></span></div><span class="${SKEL} h-5 w-20"></span><div class="grid grid-cols-3 gap-4 border-t pt-4">${Array.from({ length: 5 }, () => `<span class="${SKEL} h-8"></span>`).join('')}</div></div>`).join('');
    const body = S.region === 'loading' ? `<div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-4" aria-busy="true">${loadingCards}</div>`
      : S.region === 'error' ? `<div data-slot="card" class="${CARD}">${regionError({ title: 'Could not load provider health', text: 'The gateway rejected the dashboard credentials.', reqId: 'req-77ad' })}</div>`
      : `<div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-4">${cards}</div>`;
    return `<div class="mx-auto flex w-full max-w-screen-2xl flex-col gap-4 p-4 md:p-6">
<section aria-labelledby="win-h" class="flex flex-wrap items-center gap-3"><h2 id="win-h" class="sr-only">Window</h2>${toggleGroup('Window', [['5', '5 min'], ['15', '15 min'], ['60', '60 min']], String(S.win), 'setWin')}<span class="tabular text-xs text-muted-foreground">updated ${S.updated} s ago</span></section>
<section aria-labelledby="targets-h"><h2 id="targets-h" class="sr-only">Targets</h2>${body}</section>
</div>`;
  }
});

</script>
</body>
</html>
