# Local stack for Tamiz (T-OPS-01): the gateway with everything it uses, and the dashboard.
#
#   pnpm compose:env             # once: writes apps/{gateway,dashboard}/.env.docker, prints the keys
#   docker compose up -d         # healthy in about a minute; the first start also pulls the model
#   docker compose logs -f ollama-pull   # model download progress (llama3.1:8b, about 5 GB)
#
# Published on this machine only (127.0.0.1): gateway http://localhost:3000, dashboard
# http://localhost:3100, Jaeger UI http://localhost:16686, Postgres 5432 and Valkey 6379.
# The privacy service and Ollama stay on the compose network.
#
# To run the gateway on the host instead (pnpm --filter @tamiz/gateway dev), add the dev
# overlay, which also publishes the privacy service (8001) and Ollama (11434) on 127.0.0.1:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d privacy ollama postgres valkey jaeger

services:
  # The routing gateway (specs 002-006). Secrets and the policy file come from
  # apps/gateway/.env.docker; the addresses of its dependencies are set here.
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: apps/gateway/.env.docker
        format: raw
        required: false   # without it the gateway exits naming the missing variables
    environment:
      LOG_LEVEL: info
      TAMIZ_PRIVACY_URL: http://privacy:8001
      OLLAMA_BASE_URL: http://ollama:11434/v1
      REDIS_URL: redis://valkey:6379
      DATABASE_URL: postgres://tamiz:tamiz@postgres:5432/tamiz
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: tamiz-gateway
    depends_on:
      privacy: { condition: service_healthy }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      ollama: { condition: service_healthy }
      jaeger: { condition: service_started }
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  # Operator console (spec 008). Secrets come from apps/dashboard/.env.docker, read raw so
  # the passphrase hash's `$` needs no escaping.
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "127.0.0.1:3100:3100"
    env_file:
      - path: apps/dashboard/.env.docker
        format: raw
        required: false
    environment:
      TAMIZ_GATEWAY_URL: http://gateway:3000
      TAMIZ_DASHBOARD_PUBLIC_URL: http://localhost:3100
    depends_on:
      gateway: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  # Personal-data detection and anonymization (spec 004). It has no authentication, so it
  # is reachable only on the compose network (http://privacy:8001), never published.
  # For local debugging, run it with uv instead (services/privacy/README.md).
  privacy:
    build: services/privacy
    expose:
      - "8001"
    environment:
      PRIVACY_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # The local model server: the only target critical data may reach (spec 005). Models
  # live in a volume, so they are downloaded once.
  ollama:
    image: ollama/ollama:0.40.5
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  # Pulls the model of the policies' local target, then exits. A no-op once the model is in
  # the volume. The gateway does not wait for it: until it finishes, local requests fail
  # and the dashboard shows the circuit opening.
  ollama-pull:
    image: ollama/ollama:0.40.5
    entrypoint: ["ollama", "pull", "llama3.1:8b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama: { condition: service_healthy }
    restart: "no"

  # Shared circuit breaker state between gateway instances (spec 003).
  valkey:
    image: valkey/valkey:8
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Audit log, API keys and policy versions (specs 006, 008). Local credentials only.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tamiz
      POSTGRES_PASSWORD: tamiz
      POSTGRES_DB: tamiz
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamiz -d tamiz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Traces (spec 006 FR-011): OTLP/HTTP on 4318, the UI on 16686. Spans carry no content.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

volumes:
  postgres-data:
  ollama-models:
